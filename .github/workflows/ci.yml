# Lint, conventional-commit subjects and unit tests on every PR, in the merge queue,
# and after each merge to development or main. Mirrors the Makefile (`make lint`, `make test`).
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make lint

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gates.py range needs both endpoints in history
      - name: Conventional commit subjects
        run: >-
          python3 ci/gates.py range
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: sigstore/cosign-installer@v4.1.2   # cosign 3: the signing tests use real keypairs
      - run: uv sync --frozen
      - run: make test
